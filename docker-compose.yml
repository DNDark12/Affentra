services:
  app:
    build:
      context: ./
      dockerfile: docker/php/Dockerfile
    image: affentra-app
    container_name: affentra-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
      - mailpit
    networks:
      - affentra-network

  worker-sync:
    image: affentra-app
    container_name: affentra-worker-sync
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      php artisan queue:work
      --sleep=1 --tries=3 --timeout=120 --memory=256 --no-interaction
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - mysql
      - redis
    networks:
      - affentra-network

  scheduler:
    image: affentra-app
    container_name: affentra-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - mysql
      - redis
    networks:
      - affentra-network

  web:
    image: nginx:alpine
    container_name: affentra-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - affentra-network

  mysql:
    image: mysql:8.0
    container_name: affentra-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-affentra}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-affentra}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - affentra-network

  redis:
    image: redis:7-alpine
    container_name: affentra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - affentra-network

  mailpit:
    image: 'axllent/mailpit:latest'
    container_name: affentra-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - affentra-network

  scraper:
    build:
      context: ./services/scraper
      dockerfile: Dockerfile
    container_name: affentra-scraper
    restart: unless-stopped
    environment:
      - API_SECRET_KEY=${SCRAPER_API_KEY:-dev-secret-key}
      - PAGE_LOAD_TIMEOUT=15
      - REQUEST_TIMEOUT=30
      - MAX_BROWSER_CONTEXTS=3
    ports:
      - "8001:8000"
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - affentra-network

networks:
  affentra-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
