services:
  app:
    build:
      context: ./
      dockerfile: docker/php/Dockerfile
    image: affentra-app
    container_name: affentra-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
      - mailpit
    networks:
      - affentra-network

  web:
    image: nginx:alpine
    container_name: affentra-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - affentra-network

  mysql:
    image: mysql:8.0
    container_name: affentra-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-affentra}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-affentra}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - affentra-network

  redis:
    image: redis:7-alpine
    container_name: affentra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - affentra-network

  mailpit:
    image: 'axllent/mailpit:latest'
    container_name: affentra-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - affentra-network

networks:
  affentra-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
